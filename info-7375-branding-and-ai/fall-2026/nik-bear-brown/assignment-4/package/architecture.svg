<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <title>Opportunity Matcher — Architecture</title>
  <rect x="0" y="0" width="1200" height="640" fill="#F7F3EA"/>
  <text x="40" y="48" font-size="30" font-weight="bold" fill="#111111">Opportunity Matcher — Architecture</text>
  <text x="40" y="76" font-size="16" fill="#8A8578">deterministic scoring · two implementations, one spec (Python + n8n) · 2026-10-03</text>

  <!-- helper styles via groups -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#B8472F"/>
    </marker>
  </defs>

  <!-- SOURCES -->
  <rect x="40" y="120" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="125" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">SOURCES</text>
  <text x="125" y="172" font-size="13" text-anchor="middle" fill="#111111">18 job boards</text>
  <text x="125" y="192" font-size="13" text-anchor="middle" fill="#111111">Anthropic live feed</text>

  <!-- FETCH -->
  <rect x="270" y="120" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="355" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">FETCH</text>
  <text x="355" y="172" font-size="13" text-anchor="middle" fill="#111111">polite pull</text>
  <text x="355" y="192" font-size="13" text-anchor="middle" fill="#111111">retry + backoff</text>

  <!-- NORMALIZE -->
  <rect x="500" y="120" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="585" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">NORMALIZE</text>
  <text x="585" y="172" font-size="13" text-anchor="middle" fill="#111111">one record shape</text>
  <text x="585" y="192" font-size="13" text-anchor="middle" fill="#111111">malformed → quarantine</text>

  <!-- SCORE -->
  <rect x="730" y="120" width="190" height="90" rx="10" fill="#FFFFFF" stroke="#2F6BB8" stroke-width="3"/>
  <text x="825" y="146" font-size="16" font-weight="bold" text-anchor="middle" fill="#2F6BB8">SCORE (intelligence)</text>
  <text x="825" y="168" font-size="12" text-anchor="middle" fill="#111111">role .30 · audience .20</text>
  <text x="825" y="186" font-size="12" text-anchor="middle" fill="#111111">materials .20 · gap .15 · co .15</text>
  <text x="825" y="202" font-size="12" text-anchor="middle" fill="#111111">pairing rule + weighted vocab</text>

  <!-- ROUTE -->
  <rect x="980" y="120" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="1065" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">ROUTE</text>
  <text x="1065" y="172" font-size="13" text-anchor="middle" fill="#111111">PURSUE ≥ .65</text>
  <text x="1065" y="192" font-size="13" text-anchor="middle" fill="#111111">NETWORK ≥ .45 · WATCH ≥ .25</text>

  <!-- main flow arrows -->
  <line x1="210" y1="165" x2="265" y2="165" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="165" x2="495" y2="165" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="165" x2="725" y2="165" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="920" y1="165" x2="975" y2="165" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>

  <!-- OUTPUTS -->
  <rect x="730" y="280" width="420" height="110" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="940" y="308" font-size="16" font-weight="bold" text-anchor="middle" fill="#111111">OUTPUTS (human-usable)</text>
  <text x="940" y="332" font-size="13" text-anchor="middle" fill="#111111">digest.md + digest.html · 15 role briefs · run-report.json</text>
  <text x="940" y="354" font-size="13" text-anchor="middle" fill="#111111">each brief: score · reasons · posting link · next step</text>
  <text x="940" y="376" font-size="13" text-anchor="middle" fill="#2E8B57">non-technical test: open the HTML, use it</text>
  <line x1="1065" y1="210" x2="1065" y2="275" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>

  <!-- QUARANTINE (failure path) -->
  <rect x="500" y="280" width="170" height="110" rx="10" fill="#FFFFFF" stroke="#B8472F" stroke-width="3"/>
  <text x="585" y="308" font-size="16" font-weight="bold" text-anchor="middle" fill="#B8472F">QUARANTINE</text>
  <text x="585" y="332" font-size="13" text-anchor="middle" fill="#111111">malformed records</text>
  <text x="585" y="354" font-size="13" text-anchor="middle" fill="#111111">scoring exceptions</text>
  <text x="585" y="376" font-size="13" text-anchor="middle" fill="#111111">logged, never dropped</text>
  <line x1="585" y1="210" x2="585" y2="275" stroke="#B8472F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="600" y="252" font-size="12" fill="#B8472F">failure path</text>

  <!-- CACHED FALLBACK (failure path) -->
  <rect x="270" y="280" width="170" height="110" rx="10" fill="#FFFFFF" stroke="#B8472F" stroke-width="3"/>
  <text x="355" y="308" font-size="16" font-weight="bold" text-anchor="middle" fill="#B8472F">CACHED FALLBACK</text>
  <text x="355" y="332" font-size="13" text-anchor="middle" fill="#111111">fetch fails →</text>
  <text x="355" y="354" font-size="13" text-anchor="middle" fill="#111111">run on last good pull</text>
  <text x="355" y="376" font-size="13" text-anchor="middle" fill="#111111">flagged in report</text>
  <line x1="355" y1="210" x2="355" y2="275" stroke="#B8472F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>

  <!-- DELIVERY (planned, dashed) -->
  <rect x="270" y="450" width="880" height="120" rx="10" fill="none" stroke="#8A8578" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="710" y="480" font-size="16" font-weight="bold" text-anchor="middle" fill="#8A8578">DELIVERY — specified, not yet implemented (the blocker)</text>
  <text x="710" y="506" font-size="14" text-anchor="middle" fill="#8A8578">human approval gate → weekly digest → email to Nik</text>
  <text x="710" y="532" font-size="14" text-anchor="middle" fill="#8A8578">scheduled in n8n · approval required before send</text>
  <text x="710" y="556" font-size="13" text-anchor="middle" fill="#B8472F">TODO — see workflow_v2.json</text>
  <line x1="940" y1="390" x2="940" y2="445" stroke="#8A8578" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- legend -->
  <rect x="40" y="450" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="135" y="478" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Legend</text>
  <line x1="60" y1="500" x2="100" y2="500" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>
  <text x="110" y="505" font-size="13" fill="#111111">data flow</text>
  <line x1="60" y1="528" x2="100" y2="528" stroke="#B8472F" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="110" y="533" font-size="13" fill="#111111">failure path</text>
  <rect x="60" y="546" width="40" height="14" fill="none" stroke="#8A8578" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="110" y="558" font-size="13" fill="#111111">planned</text>

  <!-- footer -->
  <text x="40" y="612" font-size="14" fill="#111111">Built with n8n + Python · deterministic scoring · no black boxes · $0.00/month operating cost</text>
</svg>
